<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f8"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#182033" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1280" height="820" rx="30" fill="url(#bg)"/>
  <text x="70" y="82" font-family="Segoe UI, Arial" font-size="36" font-weight="600" fill="#182033">LifeFlow Use Case Diagram</text>
  <text x="70" y="118" font-family="Segoe UI, Arial" font-size="18" fill="#6b7688">How public donors and admin staff use the blood bank system</text>

  <g filter="url(#shadow)">
    <rect x="340" y="160" width="600" height="560" rx="26" fill="#ffffff" stroke="#e3e8f1"/>
    <text x="560" y="205" font-family="Segoe UI, Arial" font-size="24" font-weight="600" fill="#182033">LifeFlow System</text>
  </g>

  <g>
    <circle cx="150" cy="270" r="32" fill="#c9253d"/>
    <path d="M100 380 C108 316 192 316 200 380" fill="#c9253d"/>
    <text x="85" y="430" font-family="Segoe UI, Arial" font-size="22" font-weight="600" fill="#182033">Public Donor</text>
  </g>

  <g>
    <circle cx="1120" cy="270" r="32" fill="#2f6bdc"/>
    <path d="M1070 380 C1078 316 1162 316 1170 380" fill="#2f6bdc"/>
    <text x="1070" y="430" font-family="Segoe UI, Arial" font-size="22" font-weight="600" fill="#182033">Admin Staff</text>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial" font-size="17" fill="#182033">
    <ellipse cx="520" cy="270" rx="125" ry="42" fill="#fff5f7" stroke="#f7cbd3"/>
    <text x="455" y="276">View Home Page</text>
    <ellipse cx="520" cy="370" rx="135" ry="42" fill="#fff5f7" stroke="#f7cbd3"/>
    <text x="445" y="376">Register as Donor</text>

    <ellipse cx="755" cy="250" rx="128" ry="42" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="690" y="256">Admin Login</text>
    <ellipse cx="755" cy="340" rx="140" ry="42" fill="#f8fafc" stroke="#e3e8f1"/>
    <text x="680" y="346">Manage Donors</text>
    <ellipse cx="755" cy="430" rx="140" ry="42" fill="#f8fafc" stroke="#e3e8f1"/>
    <text x="680" y="436">Manage Stock</text>
    <ellipse cx="755" cy="520" rx="150" ry="42" fill="#f8fafc" stroke="#e3e8f1"/>
    <text x="675" y="526">Manage Requests</text>
    <ellipse cx="755" cy="610" rx="145" ry="42" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="682" y="616">Issue Blood</text>
    <ellipse cx="520" cy="590" rx="130" ry="42" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="455" y="596">View Reports</text>
  </g>

  <g stroke="#c9253d" stroke-width="3" opacity="0.82">
    <line x1="205" y1="290" x2="390" y2="270"/>
    <line x1="205" y1="340" x2="390" y2="370"/>
  </g>
  <g stroke="#2f6bdc" stroke-width="3" opacity="0.82">
    <line x1="1070" y1="285" x2="885" y2="250"/>
    <line x1="1070" y1="320" x2="895" y2="340"/>
    <line x1="1070" y1="350" x2="895" y2="430"/>
    <line x1="1070" y1="380" x2="902" y2="520"/>
    <line x1="1080" y1="400" x2="895" y2="610"/>
    <line x1="1070" y1="410" x2="650" y2="590"/>
  </g>

  <path d="M650 520 C690 540 708 560 725 590" fill="none" stroke="#149b68" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="620" y="560" font-family="Segoe UI, Arial" font-size="15" fill="#149b68">approved request leads to transfer</text>
