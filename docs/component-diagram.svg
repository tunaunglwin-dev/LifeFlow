<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f8"/>
      <stop offset="0.55" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f04a5f"/>
      <stop offset="1" stop-color="#981b2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#182033" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#c9253d"/>
    </marker>
  </defs>
  <rect width="1280" height="820" rx="30" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="120" fill="#c9253d" opacity="0.08"/>
  <circle cx="180" cy="690" r="150" fill="#2f6bdc" opacity="0.07"/>

  <text x="70" y="86" font-family="Segoe UI, Arial" font-size="36" font-weight="600" fill="#182033">LifeFlow Component Diagram</text>
  <text x="70" y="122" font-family="Segoe UI, Arial" font-size="18" fill="#6b7688">Vue.js frontend, C# ASP.NET Core API, and PostgreSQL database deployment flow</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="260" height="170" rx="18" fill="#ffffff" stroke="#e3e8f1"/>
    <text x="110" y="238" font-family="Segoe UI, Arial" font-size="22" font-weight="600" fill="#182033">Public User</text>
    <text x="110" y="270" font-family="Segoe UI, Arial" font-size="16" fill="#6b7688">Visitor / donor</text>
    <circle cx="250" cy="270" r="45" fill="#fff1f2" stroke="#fecdd3"/>
    <path d="M250 238 C270 262 286 281 250 310 C214 281 230 262 250 238Z" fill="url(#red)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="460" width="260" height="170" rx="18" fill="#ffffff" stroke="#e3e8f1"/>
    <text x="110" y="508" font-family="Segoe UI, Arial" font-size="22" font-weight="600" fill="#182033">Admin Staff</text>
    <text x="110" y="540" font-family="Segoe UI, Arial" font-size="16" fill="#6b7688">Manages records</text>
    <circle cx="252" cy="542" r="46" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="252" cy="520" r="20" fill="#2f6bdc"/>
    <path d="M218 582 C222 548 282 548 286 582Z" fill="#2f6bdc"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="475" y="170" width="330" height="470" rx="22" fill="#ffffff" stroke="#e3e8f1"/>
    <text x="525" y="220" font-family="Segoe UI, Arial" font-size="24" font-weight="600" fill="#182033">Vue.js Frontend</text>
    <text x="525" y="250" font-family="Segoe UI, Arial" font-size="16" fill="#6b7688">Hosted on Vercel</text>
    <rect x="525" y="295" width="230" height="54" rx="12" fill="#fff5f7" stroke="#f7cbd3"/>
    <text x="550" y="328" font-family="Segoe UI, Arial" font-size="16" fill="#981b2d">Home / About Pages</text>
    <rect x="525" y="365" width="230" height="54" rx="12" fill="#f8fafc" stroke="#e3e8f1"/>
    <text x="550" y="398" font-family="Segoe UI, Arial" font-size="16" fill="#182033">Donor Register</text>
    <rect x="525" y="435" width="230" height="54" rx="12" fill="#f8fafc" stroke="#e3e8f1"/>
    <text x="550" y="468" font-family="Segoe UI, Arial" font-size="16" fill="#182033">Admin Login</text>
    <rect x="525" y="505" width="230" height="54" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="550" y="538" font-family="Segoe UI, Arial" font-size="16" fill="#166534">Dashboard + CRUD UI</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="190" width="300" height="180" rx="20" fill="#ffffff" stroke="#e3e8f1"/>
    <text x="955" y="240" font-family="Segoe UI, Arial" font-size="24" font-weight="600" fill="#182033">C# API</text>
    <text x="955" y="270" font-family="Segoe UI, Arial" font-size="16" fill="#6b7688">ASP.NET Core on Render</text>
    <text x="955" y="318" font-family="Segoe UI, Arial" font-size="16" fill="#182033">REST endpoints</text>
    <text x="955" y="345" font-family="Segoe UI, Arial" font-size="16" fill="#182033">Validation + transfer logic</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="480" width="300" height="160" rx="20" fill="#ffffff" stroke="#e3e8f1"/>
    <text x="955" y="530" font-family="Segoe UI, Arial" font-size="24" font-weight="600" fill="#182033">PostgreSQL</text>
    <text x="955" y="560" font-family="Segoe UI, Arial" font-size="16" fill="#6b7688">Render database</text>
    <text x="955" y="605" font-family="Segoe UI, Arial" font-size="16" fill="#182033">users, donors, stock,</text>
    <text x="955" y="630" font-family="Segoe UI, Arial" font-size="16" fill="#182033">requests, transfers</text>
  </g>

  <line x1="330" y1="275" x2="470" y2="330" stroke="#c9253d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="330" y1="545" x2="470" y2="500" stroke="#c9253d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="805" y1="405" x2="905" y2="285" stroke="#c9253d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1060" y1="370" x2="1060" y2="475" stroke="#c9253d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="910" y1="555" x2="805" y2="535" stroke="#2f6bdc" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>

  <text x="360" y="282" font-family="Segoe UI, Arial" font-size="15" fill="#6b7688">register donor</text>
  <text x="360" y="535" font-family="Segoe UI, Arial" font-size="15" fill="#6b7688">manage system</text>
  <text x="825" y="330" font-family="Segoe UI, Arial" font-size="15" fill="#6b7688">API calls</text>
  <text x="1075" y="430" font-family="Segoe UI, Arial" font-size="15" fill="#6b7688">SQL</text>
  <text x="805" y="590" font-family="Segoe UI, Arial" font-size="15" fill="#6b7688">data response</text>
</svg>
